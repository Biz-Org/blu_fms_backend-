name: fms-odoo18

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - fms18-db-data:/var/lib/postgresql/data

  odoo:
    build:
      context: ../..
      dockerfile: docker/odoo18/Dockerfile
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - fms18-odoo-data:/var/lib/odoo

volumes:
  fms18-db-data:
  fms18-odoo-data:
