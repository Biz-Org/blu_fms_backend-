services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - fms-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    build: .
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: ${HOST:-db}
      PORT: ${PORT:-5432}
      USER: ${USER:-odoo}
      PASSWORD: ${PASSWORD:-odoo}
    volumes:
      - fms-web-data:/var/lib/odoo
      # Live-mount addons for development (optional; comment out for image-only deploy)
      - ./addons:/mnt/extra-addons/addons:ro
      - ./property_management:/mnt/extra-addons/property_management:ro
      - ./apartment_management:/mnt/extra-addons/apartment_management:ro
      - ./esg_management:/mnt/extra-addons/esg_management:ro
      - ./gate_management:/mnt/extra-addons/gate_management:ro
      - ./owner_tenant_management:/mnt/extra-addons/owner_tenant_management:ro
      - ./resident_management:/mnt/extra-addons/resident_management:ro
      - ./workforce_management:/mnt/extra-addons/workforce_management:ro
    restart: unless-stopped

volumes:
  fms-db-data:
  fms-web-data:
