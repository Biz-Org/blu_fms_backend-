services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - fms-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    build: .
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: ${HOST:-db}
      PORT: ${PORT:-5432}
      USER: ${USER:-odoo}
      PASSWORD: ${PASSWORD:-odoo}
    volumes:
      - fms-web-data:/var/lib/odoo
      # Live-mount all root-level modules for development (optional; comment out for image-only deploy)
      - .:/mnt/extra-addons:ro
    restart: unless-stopped

volumes:
  fms-db-data:
  fms-web-data:
